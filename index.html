<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0c1320" />
  <meta name="description" content="Slotcars Simulator: piste personalizzate, fisica credibile e sfide multiplayer locali." />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Slotcars Simulator — Miniature Racing</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
<script>
(function(){function go(){var f=document.querySelector('.footer');if(!f||!window.fetch)return;var n=document.createElement('span');n.id='visits';n.hidden=true;f.insertBefore(n,f.lastElementChild);fetch('https://pippopoppi.goatcounter.com/counter/'+location.pathname+'.json').then(function(r){return r.ok?r.json():null;}).then(function(d){var c=d&&String(d.count||'');if(!c||c==='0')return;n.textContent=c==='1'?'GIOCATO 1 VOLTA':'GIOCATO '+c+' VOLTE';n.hidden=false;}).catch(function(){});}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();})();
</script>
<!-- Visitor count (GoatCounter: no cookies, no personal data) -->
<script data-goatcounter="https://pippopoppi.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
